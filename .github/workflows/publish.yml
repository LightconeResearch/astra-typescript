name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm run build
      # npm normalizes a PEP 440 tag such as v0.2.0rc1 to 0.2.0-rc1, so the
      # prerelease check reads the normalized version, not the tag name.
      - name: Set version from release tag
        id: version
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "Publishing $version under the $dist_tag dist-tag"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - run: npm publish --tag "${{ steps.version.outputs.dist_tag }}"
      # A prerelease must not move main's version.
      - name: Commit updated version to main
        if: steps.version.outputs.dist_tag == 'latest'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --staged --quiet || (git commit -m "chore: bump version to ${GITHUB_REF_NAME#v}" && git push origin HEAD:main)
