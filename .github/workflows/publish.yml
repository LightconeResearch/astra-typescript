name: Publish to npm

# Triggered by publishing a GitHub Release. The release's tag (e.g.,
# v0.0.2) is the single source of truth for the published version —
# the workflow rewrites package.json to match before publishing, so
# you never have to bump the version locally.
on:
  release:
    types: [published]

# `id-token: write` is required for npm Trusted Publishing (OIDC).
# `contents: read` is the default; we list it explicitly so the
# workflow's intended scope is obvious.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm CLI >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Sync package.json with the release tag (strip leading "v"),
      # so the published package version always matches the GitHub
      # Release. `--allow-same-version` makes this a no-op when they
      # already agree.
      - name: Sync version with release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # No NODE_AUTH_TOKEN: an empty token would actually break OIDC,
      # because npm tries to use the token instead of the OIDC flow.
      # Provenance is attached automatically with trusted publishing.
      - run: npm publish
